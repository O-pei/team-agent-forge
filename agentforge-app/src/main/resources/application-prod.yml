spring:
  datasource:
    url: jdbc:mysql://${AGENTFORGE_DB_HOST:localhost}:${AGENTFORGE_DB_PORT:3306}/${AGENTFORGE_DB_NAME:agentforge}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${AGENTFORGE_DB_USER:root}
    password: ${AGENTFORGE_DB_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

agentforge:
  memory:
    redis-enabled: ${AGENTFORGE_REDIS_ENABLED:true}
