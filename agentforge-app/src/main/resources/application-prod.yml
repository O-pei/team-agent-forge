spring:
  datasource:
    url: jdbc:mysql://${AGENTFORGE_DB_HOST:localhost}:${AGENTFORGE_DB_PORT:3306}/${AGENTFORGE_DB_NAME:agentforge}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 生产环境不提供默认账号密码：未设置环境变量时 Spring 占位符解析失败，启动即报错（故障关闭，避免误用 root/root）。
    username: ${AGENTFORGE_DB_USER}
    password: ${AGENTFORGE_DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

agentforge:
  auth:
    # 生产必须显式提供 JWT 签名密钥（>=32 字节）；缺失即启动失败（故障关闭）。
    # 注意：绑定前缀是 agentforge.auth（AuthProperties），不是 agentforge.security。
    jwt-secret: ${AGENTFORGE_JWT_SECRET}
    # 生产禁用 dev 默认管理员种子
    seed-admin-enabled: false
    expose-code-in-response: false
    mail-enabled: ${AGENTFORGE_MAIL_ENABLED:true}
  crypto:
    # AES-GCM 主密钥（加密模型 Key 与数据源密码）；缺失即启动失败。
    key: ${AGENTFORGE_CRYPTO_KEY}
  memory:
    redis-enabled: ${AGENTFORGE_REDIS_ENABLED:true}
