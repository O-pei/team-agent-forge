spring:
  application:
    name: agentforge
  profiles:
    active: dev
  ai:
    dashscope:
      # 占位值仅用于让 SAA DashScope 自动配置完成启动；真实调用由 ModelProviderFactory 按数据库配置创建。
      # 配置真实 Key 时设置环境变量 AI_DASHSCOPE_API_KEY 即可覆盖。
      api-key: ${AI_DASHSCOPE_API_KEY:sk-agentforge-development-placeholder}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Shanghai
  # SMTP 配置：填写后把 agentforge.auth.mail-enabled 置为 true 即启用真实邮件发送；
  # 不配置时由 RouterMailSender 走日志兜底（仅开发环境打印验证码）。
  # mail:
  #   host: ${MAIL_HOST:}
  #   port: ${MAIL_PORT:465}
  #   username: ${MAIL_USERNAME:}
  #   password: ${MAIL_PASSWORD:}
  #   default-encoding: UTF-8
  #   properties:
  #     mail.smtp.auth: true
  #     mail.smtp.ssl.enable: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

agentforge:
  auth:
    # 生产环境务必通过环境变量 AGENTFORGE_JWT_SECRET 覆盖（>= 32 字节）
    jwt-secret: ${AGENTFORGE_JWT_SECRET:agentforge-dev-only-secret-change-me-0123456789}
    access-token-ttl: 2h
    refresh-token-ttl: 7d
    # 邮箱验证码 5 分钟有效（契约 §2.1）
    email-code-ttl: 5m
    email-code-length: 6
    email-code-max-attempts: 5
    email-code-cooldown: 60s
    email-code-hourly-limit: 10
    email-code-ip-hourly-limit: 20
    login-max-failures: 5
    login-lock-duration: 15m
    # 未配置 SMTP 时开发环境使用日志输出验证码
    mail-enabled: ${AGENTFORGE_MAIL_ENABLED:false}
    sms-enabled: false
    # dev 联调/演示用：为 true 时发码响应体返回 devCode；生产环境必须保持 false
    expose-code-in-response: ${AGENTFORGE_EXPOSE_CODE:false}
    # 仅 dev 生效的默认管理员种子（契约附录 A），用户已存在时跳过
    seed-admin-enabled: ${AGENTFORGE_SEED_ADMIN:true}
    seed-admin-email: admin@agentforge.dev
    seed-admin-username: admin
    seed-admin-nickname: 系统管理员
    seed-admin-password: ${AGENTFORGE_ADMIN_PASSWORD:Admin@123456}
  audit:
    # 预算告警阈值（占总配额百分比）
    alert-threshold: 0.8
    flush-interval-ms: 2000
  quota:
    # 额度每日限额按该时区的自然日重置
    zone: Asia/Shanghai
    # 超级管理员默认不受 Token 额度限制（契约 §2.7）
    bypass-super-admin: true
  crypto:
    # AES-GCM 主密钥：模型 API Key / 数据源密码等敏感字段入库前用它加密。
    # 生产环境务必通过环境变量 AGENTFORGE_CRYPTO_KEY 覆盖；下面默认值仅供本地开发与单测使用。
    key: ${AGENTFORGE_CRYPTO_KEY:agentforge-dev-only-crypto-key-change-me}
  memory:
    redis-enabled: ${AGENTFORGE_REDIS_ENABLED:false}
    short-term-max-messages: 20
    summary-threshold: 30
  rag:
    vector-store: simple
    chunk-size: 800
    chunk-overlap: 120
    top-k: 5
  sandbox:
    enabled: true
    timeout: 10s
    max-output-bytes: 262144
    allowed-commands:
      - java
      - python
      - node

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.agentforge: DEBUG
