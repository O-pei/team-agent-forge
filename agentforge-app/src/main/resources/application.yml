spring:
  application:
    name: agentforge
  profiles:
    active: dev
  ai:
    dashscope:
      # 占位值仅用于让 SAA DashScope 自动配置完成启动；真实调用由 ModelProviderFactory 按数据库配置创建。
      # 配置真实 Key 时设置环境变量 AI_DASHSCOPE_API_KEY 即可覆盖。
      api-key: ${AI_DASHSCOPE_API_KEY:sk-agentforge-development-placeholder}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Shanghai

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

agentforge:
  auth:
    # 生产环境务必通过环境变量 AGENTFORGE_JWT_SECRET 覆盖（>= 32 字节）
    jwt-secret: ${AGENTFORGE_JWT_SECRET:agentforge-dev-only-secret-change-me-0123456789}
    access-token-ttl: 2h
    refresh-token-ttl: 7d
    email-code-ttl: 10m
    email-code-length: 6
    # 未配置 SMTP 时开发环境使用日志输出验证码
    mail-enabled: ${AGENTFORGE_MAIL_ENABLED:false}
    sms-enabled: false
  audit:
    # 预算告警阈值（占总配额百分比）
    alert-threshold: 0.8
    flush-interval-ms: 2000
  memory:
    redis-enabled: ${AGENTFORGE_REDIS_ENABLED:false}
    short-term-max-messages: 20
    summary-threshold: 30
  rag:
    vector-store: simple
    chunk-size: 800
    chunk-overlap: 120
    top-k: 5
  sandbox:
    enabled: true
    timeout: 10s
    max-output-bytes: 262144
    allowed-commands:
      - java
      - python
      - node

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.agentforge: DEBUG
