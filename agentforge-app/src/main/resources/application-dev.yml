spring:
  datasource:
    url: jdbc:h2:file:./.data/agentforge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

# dev 默认不要求 Redis；关闭其健康检查，避免 /actuator/health 因无 Redis 变 DOWN
management:
  health:
    redis:
      enabled: false

agentforge:
  memory:
    redis-enabled: false
  quota:
    # 额度每日限额按该时区的自然日重置
    zone: Asia/Shanghai
    # 超级管理员默认不受 Token 额度限制（契约 §2.7）
    bypass-super-admin: true
