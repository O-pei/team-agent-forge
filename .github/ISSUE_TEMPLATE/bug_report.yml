name: Bug report
description: 报告一个可复现的缺陷
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索已有 Issue，并**不要粘贴真实 API Key / 数据库密码 / JWT**。
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 实际发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 启动 `java -jar agentforge-app/target/...`
        2. 调用 `POST /api/v1/...`
        3. 看到...
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - agentforge-security
        - agentforge-audit
        - agentforge-memory
        - agentforge-rag
        - agentforge-datasource
        - agentforge-agent
        - agentforge-app
        - agentforge-ui
        - 文档 / 构建
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / commit
      placeholder: v0.1.0 或 git commit hash
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      placeholder: OS、JDK、Maven、Node、是否 Redis/MySQL/Docker、模型 provider
  - type: textarea
    id: logs
    attributes:
      label: 日志 / 堆栈
      description: 已脱敏的相关日志（traceId 有助于定位）
      render: shell
